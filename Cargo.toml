[workspace]
resolver = "2"
members = ["engine", "cli", "src-tauri"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
authors = ["ZeroDay-Labz"]
repository = "https://github.com/ZeroDay-Labz/shrike"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
# MITM proxy plumbing (CONNECT handling, TLS termination, hyper client/server glue)
hudsucker = { version = "0.25", default-features = false, features = ["rcgen-ca", "rustls-client", "http2"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "logging", "ring", "webpki-roots"] }
http-body-util = "0.1"
bytes = "1"
# CA / certificates / TLS
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
rustls-native-certs = "0.8"
time = "0.3"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
# storage
rusqlite = { version = "0.37", features = ["bundled"] }
# cli / logging / errors / config
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
percent-encoding = "2"
