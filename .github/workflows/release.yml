# Build and publish release artifacts when a version tag (v*) is pushed.
#
# Produces:
#   Linux   — .deb, .rpm, .AppImage (Tauri bundler) and a portable .tar.gz
#   Windows — NSIS installer (.exe)
#   Flatpak — .flatpak bundle assembled from the Linux tarball
#
# Chrome for Testing IS bundled into every package (fetched per-OS before the
# Tauri build) so the integrated browser works with no system browser and no
# network. Jython is still fetched on demand at runtime (one-click setup).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and attach assets to, e.g. v0.2.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bundles:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, rpm, AppImage, tar.gz)
            os: ubuntu-22.04
            targets: deb,rpm,appimage
          - name: Windows (exe)
            os: windows-latest
            targets: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf rpm libssl-dev build-essential curl wget file libfuse2 unzip

      - name: Install UI dependencies
        run: npm --prefix ui ci

      # Fetch Chrome for Testing into src-tauri/resources/chromium/ so the Tauri
      # bundler folds it into the package (the resources glob picks it up).
      - name: Bundle Chromium
        run: node scripts/fetch-chromium.mjs

      - name: Build bundles
        run: npm --prefix ui exec -- tauri build --bundles ${{ matrix.targets }}

      - name: Build the headless CLI (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --bin shrike

      - name: Portable tarball (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/package-tarball.sh

      - name: Upload artifacts (for the flatpak job)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            dist/*.tar.gz

  flatpak:
    name: Flatpak
    needs: bundles
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: dist

      - name: Point the manifest at the built tarball
        run: |
          TARBALL=$(ls dist/*.tar.gz | head -1)
          SHA=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          # flatpak-builder resolves `path:` relative to the manifest's directory.
          sed -i "s#__TARBALL_PATH__#../../$TARBALL#; s#__TARBALL_SHA256__#$SHA#" \
            packaging/flatpak/com.zerodaylabz.shrike.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: shrike.flatpak
          manifest-path: packaging/flatpak/com.zerodaylabz.shrike.yml
          cache: false
          upload-artifact: false

      - name: Publish flatpak to the GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: shrike.flatpak
