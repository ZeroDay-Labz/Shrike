# Build and publish release artifacts when a version tag (v*) is pushed.
#
# Produces:
#   Linux   — .rpm, .AppImage (Tauri bundler) and a portable .tar.gz
#   Windows — NSIS installer (.exe)
#   Flatpak — .flatpak bundle assembled from the Linux tarball
#
# The bundled Chromium and Jython are NOT fetched in CI (hundreds of MB): the app
# falls back to a system Chromium and offers one-click Jython setup at runtime.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundles:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (rpm, AppImage, tar.gz)
            os: ubuntu-22.04
            targets: rpm,appimage
          - name: Windows (exe)
            os: windows-latest
            targets: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf rpm libssl-dev build-essential curl wget file libfuse2

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build bundles
        run: npm --prefix ui exec -- tauri build --bundles ${{ matrix.targets }}

      - name: Portable tarball (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/package-tarball.sh

      - name: Upload artifacts (for the flatpak job)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            dist/*.tar.gz

  flatpak:
    name: Flatpak
    needs: bundles
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: dist

      - name: Point the manifest at the built tarball
        run: |
          TARBALL=$(ls dist/*.tar.gz | head -1)
          SHA=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          sed -i "s#__TARBALL_PATH__#$TARBALL#; s#__TARBALL_SHA256__#$SHA#" \
            packaging/flatpak/com.zerodaylabz.shrike.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: shrike.flatpak
          manifest-path: packaging/flatpak/com.zerodaylabz.shrike.yml
          cache: false
          upload-artifact: false

      - name: Publish flatpak to the GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: shrike.flatpak
